apply plugin: 'com.android.application'

def studioUrl = System.getenv('STUDIO_URL') ?: ''
if (!(studioUrl ==~ /https:\/\/[A-Za-z0-9.-]+\/?/)) {
    throw new GradleException('Set STUDIO_URL to a secure origin')
}

android {
    namespace 'studio.patchforge'
    compileSdk 35

    defaultConfig {
        applicationId 'studio.patchforge'
        minSdk 24
        targetSdk 35
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0'
        buildConfigField 'String', 'URL', '"' + studioUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }
}
