name: Publish Studio Android wrapper
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wrapper:
    runs-on: ubuntu-latest
    env:
      STUDIO_URL: ${{ vars.STUDIO_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 35 build packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic
      - name: Validate release configuration
        env:
          KEYSTORE: ${{ secrets.STUDIO_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.STUDIO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$STUDIO_URL" =~ ^https://[A-Za-z0-9.-]+/?$ ]] || { echo '::error::Set repository variable STUDIO_URL to the deployed HTTPS origin.'; exit 1; }
          [[ -n "$KEYSTORE" ]] || { echo '::error::Set Actions secret STUDIO_KEYSTORE_BASE64 to the dedicated release keystore.'; exit 1; }
          [[ -n "$PASSWORD" ]] || { echo '::error::Set Actions secret STUDIO_KEYSTORE_PASSWORD.'; exit 1; }
      - name: Build release APK
        run: gradle -p android --no-daemon --console=plain assembleRelease
      - name: Align, sign and verify APK
        env:
          KEYSTORE: ${{ secrets.STUDIO_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.STUDIO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/studio.jks"
          test -s "$RUNNER_TEMP/studio.jks"
          apk="$(find android/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          [[ -n "$apk" ]] || { echo '::error::Gradle did not produce an unsigned release APK.'; exit 1; }
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          [[ -x "$tools/zipalign" && -x "$tools/apksigner" ]] || { echo '::error::Android build tools are missing.'; exit 1; }
          "$tools/zipalign" -f 4 "$apk" "$RUNNER_TEMP/studio-aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/studio.jks" --ks-pass env:PASSWORD --out PatchForge-Studio.apk "$RUNNER_TEMP/studio-aligned.apk"
          "$tools/apksigner" verify --verbose PatchForge-Studio.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "studio-$GITHUB_RUN_NUMBER" PatchForge-Studio.apk --latest --title "PatchForge Studio $GITHUB_RUN_NUMBER" --notes 'Signed Android companion app.'
