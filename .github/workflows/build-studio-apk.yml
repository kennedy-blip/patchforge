name: Publish Studio Android wrapper
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  wrapper:
    runs-on: ubuntu-latest
    env:
      STUDIO_URL: ${{ vars.STUDIO_URL }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - run: gradle -p android assembleRelease
      - name: Sign and publish
        env:
          KEYSTORE: ${{ secrets.STUDIO_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.STUDIO_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/studio.jks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/studio.jks" --ks-pass env:PASSWORD --out PatchForge-Studio.apk $(find android/build/outputs/apk/release -name '*unsigned.apk' -print -quit)
          gh release create "studio-$GITHUB_RUN_NUMBER" PatchForge-Studio.apk --latest --title "PatchForge Studio $GITHUB_RUN_NUMBER" --notes 'Signed Android companion app.'
